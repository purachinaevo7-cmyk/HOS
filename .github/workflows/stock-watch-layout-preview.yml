name: Stock Watch Layout Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-watch-layout-preview.yml'

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HOS_EXECUTION_ACCOUNT: maho
      HOS_MAHO_BUYING_POWER_JPY: ${{ secrets.HOS_MAHO_BUYING_POWER_JPY }}
      HOS_HIRO_BUYING_POWER_JPY: ${{ secrets.HOS_HIRO_BUYING_POWER_JPY }}
      HOS_MONTHLY_STOCK_BUDGET_REMAINING_JPY: ${{ secrets.HOS_MONTHLY_STOCK_BUDGET_REMAINING_JPY }}
      HOS_ANNUAL_STOCK_BUDGET_REMAINING_JPY: ${{ secrets.HOS_ANNUAL_STOCK_BUDGET_REMAINING_JPY }}
      HOS_MAX_SINGLE_ORDER_JPY: ${{ secrets.HOS_MAX_SINGLE_ORDER_JPY }}
      HOS_ALLOW_ODD_LOT: true
      HOS_STRATEGY_MAX_DAILY_ORDERS: 1
      HOS_USDJPY_PLANNING_RATE: 160
      HOS_CURRENT_ANNUAL_DIVIDEND_JPY: ${{ secrets.HOS_CURRENT_ANNUAL_DIVIDEND_JPY }}
      HOS_HOUSEHOLD_AVAILABLE_CASH_JPY: ${{ secrets.HOS_HOUSEHOLD_AVAILABLE_CASH_JPY }}
      HOS_TARGET_INVESTMENT_TO_2027_03_JPY: ${{ secrets.HOS_TARGET_INVESTMENT_TO_2027_03_JPY }}
      HOS_RESERVE_AFTER_EXECUTION_JPY: ${{ secrets.HOS_RESERVE_AFTER_EXECUTION_JPY }}
      HOS_MAHO_2026_STOCK_CAP_JPY: ${{ secrets.HOS_MAHO_2026_STOCK_CAP_JPY }}
      HOS_MAHO_STRATEGY_BUDGET_JPY: ${{ secrets.HOS_MAHO_STRATEGY_BUDGET_JPY }}
      HOS_HIRO_STRATEGY_BUDGET_JPY: ${{ secrets.HOS_HIRO_STRATEGY_BUDGET_JPY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Send layout preview
        run: |
          mkdir -p logs outputs
          set +e
          python skills/investment-agent/daily_stock_check_v3.py --mode evening > logs/layout-preview.log 2>&1
          code=$?
          cat logs/layout-preview.log
          python - "$code" <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import sys

          code = int(sys.argv[1])
          log = Path('logs/layout-preview.log').read_text(encoding='utf-8', errors='replace')
          valid_layout = (
              '【まほ口座】' in log
              and '【ひろ口座】' in log
              and '【世帯進捗】' in log
              and '【市場監視】' in log
              and 'ACCOUNT_BUDGET_SECRET_REQUIRED' not in log
              and 'Discord delivery succeeded: HTTP ' in log
          )
          result = {
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'status': 'success' if code == 0 and valid_layout else 'failure',
              'exit_code': code,
              'layout_verified': valid_layout,
              'log_tail': log[-2500:],
          }
          Path('outputs/stock-watch-layout-preview.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False))
          if result['status'] != 'success':
              raise SystemExit('layout preview verification failed')
          PY
      - name: Record preview result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/stock-watch-layout-preview.json
          git commit -m 'Record Stock Watch layout preview'
          git push
