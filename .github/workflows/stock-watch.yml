name: Stock Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-watch.yml'
  schedule:
    - cron: '7,27 12 * * 1-5'
    - cron: '7,27 22 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-watch-production
  cancel-in-progress: false

jobs:
  stock-watch:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HOS_EXECUTION_ACCOUNT: maho
      HOS_MAHO_BUYING_POWER_JPY: ${{ secrets.HOS_MAHO_BUYING_POWER_JPY }}
      HOS_HIRO_BUYING_POWER_JPY: ${{ secrets.HOS_HIRO_BUYING_POWER_JPY }}
      HOS_MONTHLY_STOCK_BUDGET_REMAINING_JPY: ${{ secrets.HOS_MONTHLY_STOCK_BUDGET_REMAINING_JPY }}
      HOS_ANNUAL_STOCK_BUDGET_REMAINING_JPY: ${{ secrets.HOS_ANNUAL_STOCK_BUDGET_REMAINING_JPY }}
      HOS_MAX_SINGLE_ORDER_JPY: ${{ secrets.HOS_MAX_SINGLE_ORDER_JPY }}
      HOS_ALLOW_ODD_LOT: true
      HOS_STRATEGY_MAX_DAILY_ORDERS: 1
      HOS_USDJPY_PLANNING_RATE: 160
      HOS_CURRENT_ANNUAL_DIVIDEND_JPY: ${{ secrets.HOS_CURRENT_ANNUAL_DIVIDEND_JPY }}
      HOS_HOUSEHOLD_AVAILABLE_CASH_JPY: ${{ secrets.HOS_HOUSEHOLD_AVAILABLE_CASH_JPY }}
      HOS_TARGET_INVESTMENT_TO_2027_03_JPY: ${{ secrets.HOS_TARGET_INVESTMENT_TO_2027_03_JPY }}
      HOS_RESERVE_AFTER_EXECUTION_JPY: ${{ secrets.HOS_RESERVE_AFTER_EXECUTION_JPY }}
      HOS_MAHO_2026_STOCK_CAP_JPY: ${{ secrets.HOS_MAHO_2026_STOCK_CAP_JPY }}
      HOS_MAHO_STRATEGY_BUDGET_JPY: ${{ secrets.HOS_MAHO_STRATEGY_BUDGET_JPY }}
      HOS_HIRO_STRATEGY_BUDGET_JPY: ${{ secrets.HOS_HIRO_STRATEGY_BUDGET_JPY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Validate Discord webhook
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured"
            exit 1
          fi

      - name: Resolve run slot
        id: slot
        run: |
          schedule='${{ github.event.schedule }}'
          if [ "$schedule" = '7,27 22 * * 0-4' ]; then
            mode='morning-retry'
          else
            mode='evening'
          fi
          run_date=$(TZ=Asia/Tokyo date +%F)
          slot="${run_date}-${mode}"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Resolved slot: $slot"

      - name: Check successful heartbeat
        id: guard
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          slot = os.environ['SLOT']
          path = Path('outputs/stock-watch-heartbeat.json')
          already_successful = False
          if path.exists():
              try:
                  current = json.loads(path.read_text(encoding='utf-8'))
                  already_successful = current.get('slot') == slot and current.get('status') == 'success'
              except Exception:
                  already_successful = False
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"should_run={'false' if already_successful else 'true'}\n")
          print(f"already_successful={already_successful}")
          PY

      - name: Run stock watch
        id: stockwatch
        if: steps.guard.outputs.should_run == 'true'
        run: |
          set +e
          set -o pipefail
          mkdir -p logs outputs
          python skills/investment-agent/daily_stock_check_v3.py --mode '${{ steps.slot.outputs.mode }}' 2>&1 | tee logs/stock-watch.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write heartbeat
        if: steps.guard.outputs.should_run == 'true'
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
          MODE: ${{ steps.slot.outputs.mode }}
          EXIT_CODE: ${{ steps.stockwatch.outputs.exit_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path

          exit_code = int(os.environ.get('EXIT_CODE') or -1)
          log_path = Path('logs/stock-watch.log')
          log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
          delivery_confirmed = 'Discord delivery succeeded: HTTP ' in log

          strategy_path = Path('outputs/strategy_order_plan.json')
          accounts = []
          signal_count = 0
          ready_count = 0
          if strategy_path.exists():
              data = json.loads(strategy_path.read_text(encoding='utf-8'))
              signals = data.get('signals', [])
              accounts = sorted({str(row.get('account')) for row in signals if row.get('account')})
              signal_count = len(signals)
              ready_count = sum(1 for row in signals if row.get('actionability') == 'READY')

          success = exit_code == 0 and delivery_confirmed and accounts == ['hiro', 'maho']
          heartbeat = {
              'slot': os.environ['SLOT'],
              'mode': os.environ['MODE'],
              'status': 'success' if success else 'failure',
              'checked_at': datetime.now(timezone.utc).isoformat(),
              'github_run_id': os.environ.get('RUN_ID'),
              'github_run_attempt': os.environ.get('RUN_ATTEMPT'),
              'exit_code': exit_code,
              'discord_delivery_confirmed': delivery_confirmed,
              'evaluated_accounts': accounts,
              'strategy_signal_count': signal_count,
              'purchase_ready_count': ready_count,
              'log_tail': log[-2000:],
          }
          Path('outputs/stock-watch-heartbeat.json').write_text(
              json.dumps(heartbeat, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(heartbeat, ensure_ascii=False))
          PY

      - name: Commit heartbeat
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/stock-watch-heartbeat.json
          if git diff --cached --quiet; then
            echo 'No heartbeat change to commit'
          else
            git commit -m "Record Stock Watch heartbeat ${{ steps.slot.outputs.slot }}"
            git pull --rebase origin main
            git push
          fi

      - name: Skip duplicate successful slot
        if: steps.guard.outputs.should_run == 'false'
        run: echo 'This run slot already completed successfully; duplicate notification skipped.'

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-watch-logs-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn

      - name: Fail when delivery was not confirmed
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          heartbeat = json.loads(Path('outputs/stock-watch-heartbeat.json').read_text(encoding='utf-8'))
          if heartbeat.get('status') != 'success':
              raise SystemExit('Stock Watch did not complete with confirmed Discord delivery and both-account evaluation')
          PY
