name: Stock Watch Active

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-watch-diagnostic.yml'
      - 'skills/investment-agent/**/*.py'
      - 'skills/investment-agent/config/portfolio_policy.json'
      - 'skills/investment-agent/config/**/*.example.json'
      - 'schemas/private_profile.schema.json'
  schedule:
    - cron: '7 12 * * 1-5'
    - cron: '27 12 * * 1-5'
    - cron: '7 22 * * 0-4'
    - cron: '27 22 * * 0-4'
    - cron: '47 22 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'evening or morning-retry'
        required: false
        default: 'morning-retry'
        type: choice
        options: [morning-retry, evening]
      force:
        description: 'Send again even if the trade-date slot already succeeded'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stock-watch-active
  cancel-in-progress: false

jobs:
  stock-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HOS_PRIVATE_PROFILE_JSON: ${{ secrets.HOS_PRIVATE_PROFILE_JSON }}
      HOS_STRATEGY_MAX_DAILY_ORDERS: '1'
      HOS_USDJPY_PLANNING_RATE: '160'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode='${{ inputs.mode }}'
            force='${{ inputs.force }}'
          elif [ "${{ github.event_name }}" = "push" ]; then
            hour=$(TZ=Asia/Tokyo date +%H)
            if [ "$hour" -lt 12 ]; then mode='morning-retry'; else mode='evening'; fi
            force='false'
          else
            case '${{ github.event.schedule }}' in
              '7 22 * * 0-4'|'27 22 * * 0-4'|'47 22 * * 0-4') mode='morning-retry' ;;
              *) mode='evening' ;;
            esac
            force='false'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Validate private delivery configuration
        shell: bash
        run: |
          test -n "$DISCORD_WEBHOOK_URL" || { echo '::error::DISCORD_WEBHOOK_URL is not configured'; exit 1; }
          test -n "$HOS_PRIVATE_PROFILE_JSON" || { echo '::error::HOS_PRIVATE_PROFILE_JSON is not configured; purchase authority will remain fail-closed'; exit 1; }

      - name: Restore value-free duplicate guard
        uses: actions/cache/restore@v4
        with:
          path: outputs/stock-watch-diagnostic.json
          key: stock-watch-diagnostic-${{ github.run_id }}
          restore-keys: stock-watch-diagnostic-

      - name: Run Stock Watch V3
        shell: bash
        run: |
          mkdir -p logs outputs
          args=(--mode '${{ steps.mode.outputs.mode }}')
          if [ '${{ steps.mode.outputs.force }}' = 'true' ]; then args+=(--force); fi
          if ! python skills/investment-agent/stock_watch_runner.py "${args[@]}" > logs/stock-watch.log 2>&1; then
            echo '::error::Stock Watch failed. Private run output was intentionally withheld from public logs.'
            exit 1
          fi

      - name: Publish public-safe heartbeat
        if: always()
        shell: bash
        run: |
          if [ -f outputs/stock-watch-diagnostic.json ]; then
            python -m json.tool outputs/stock-watch-diagnostic.json >/dev/null
          fi
          echo 'Stock Watch runtime artifacts are intentionally not committed or uploaded.'

      - name: Save value-free duplicate guard
        if: success()
        uses: actions/cache/save@v4
        with:
          path: outputs/stock-watch-diagnostic.json
          key: stock-watch-diagnostic-${{ github.run_id }}
