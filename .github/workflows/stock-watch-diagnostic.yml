name: Stock Watch Active

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-watch-diagnostic.yml'
      - 'skills/investment-agent/stock_watch_runner.py'
      - 'skills/investment-agent/household_runtime.py'
      - 'skills/investment-agent/jpx_trade_date.py'
      - 'skills/investment-agent/daily_stock_check_v3.py'
      - 'skills/investment-agent/stock_fetcher.py'
      - 'skills/investment-agent/discord_report.py'
      - 'skills/investment-agent/progress_notification.py'
      - 'skills/investment-agent/strategy_plan.py'
      - 'skills/investment-agent/purchase_authority.py'
      - 'skills/investment-agent/config/portfolio_policy.json'
      - 'skills/investment-agent/config/stock_watch_universe.json'
      - 'skills/investment-agent/config/strategies/HOS_2026_FINAL_AGGRESSIVE_V2.json'
      - 'skills/investment-agent/config/strategy_household_overrides_2026-08-12.json'
      - 'outputs/stock-watch-retry-trigger.txt'
  schedule:
    # Evening checks, roughly 21:07 / 21:27 JST on weekdays.
    - cron: '7 12 * * 1-5'
    - cron: '27 12 * * 1-5'
    # Morning recovery checks, roughly 07:07 / 07:27 / 07:47 JST.
    - cron: '7 22 * * 0-4'
    - cron: '27 22 * * 0-4'
    - cron: '47 22 * * 0-4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'evening or morning-retry'
        required: false
        default: 'morning-retry'
        type: choice
        options:
          - morning-retry
          - evening
      force:
        description: 'Send again even if the same trade-date slot already succeeded'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: stock-watch-active
  cancel-in-progress: false

jobs:
  stock-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      HOS_PRIVATE_PROFILE_JSON: ${{ secrets.HOS_PRIVATE_PROFILE_JSON }}
      HOS_EXECUTION_ACCOUNT: maho
      HOS_MAHO_BUYING_POWER_JPY: ${{ secrets.HOS_MAHO_BUYING_POWER_JPY }}
      HOS_HIRO_BUYING_POWER_JPY: ${{ secrets.HOS_HIRO_BUYING_POWER_JPY }}
      HOS_MONTHLY_STOCK_BUDGET_REMAINING_JPY: ${{ secrets.HOS_MONTHLY_STOCK_BUDGET_REMAINING_JPY }}
      HOS_ANNUAL_STOCK_BUDGET_REMAINING_JPY: ${{ secrets.HOS_ANNUAL_STOCK_BUDGET_REMAINING_JPY }}
      HOS_MAX_SINGLE_ORDER_JPY: ${{ secrets.HOS_MAX_SINGLE_ORDER_JPY }}
      HOS_ALLOW_ODD_LOT: true
      HOS_STRATEGY_MAX_DAILY_ORDERS: 1
      HOS_USDJPY_PLANNING_RATE: 160
      HOS_CURRENT_FINANCIAL_ASSETS_JPY: ${{ secrets.HOS_CURRENT_FINANCIAL_ASSETS_JPY }}
      HOS_CURRENT_ANNUAL_DIVIDEND_JPY: ${{ secrets.HOS_CURRENT_ANNUAL_DIVIDEND_JPY }}
      HOS_CURRENT_HOUSEHOLD_CASH_JPY: ${{ secrets.HOS_CURRENT_HOUSEHOLD_CASH_JPY }}
      HOS_PROTECTED_CASH_FLOOR_JPY: ${{ secrets.HOS_PROTECTED_CASH_FLOOR_JPY }}
      HOS_HIRO_TAXABLE_GIFTS_YTD_JPY: ${{ secrets.HOS_HIRO_TAXABLE_GIFTS_YTD_JPY }}
      HOS_HIRO_GIFT_TAX_REVIEWED: ${{ secrets.HOS_HIRO_GIFT_TAX_REVIEWED }}
      HOS_HOUSEHOLD_AVAILABLE_CASH_JPY: ${{ secrets.HOS_HOUSEHOLD_AVAILABLE_CASH_JPY }}
      HOS_TARGET_INVESTMENT_TO_2027_03_JPY: ${{ secrets.HOS_TARGET_INVESTMENT_TO_2027_03_JPY }}
      HOS_RESERVE_AFTER_EXECUTION_JPY: ${{ secrets.HOS_RESERVE_AFTER_EXECUTION_JPY }}
      HOS_MAHO_2026_STOCK_CAP_JPY: ${{ secrets.HOS_MAHO_2026_STOCK_CAP_JPY }}
      HOS_MAHO_STRATEGY_BUDGET_JPY: ${{ secrets.HOS_MAHO_STRATEGY_BUDGET_JPY }}
      HOS_HIRO_STRATEGY_BUDGET_JPY: ${{ secrets.HOS_HIRO_STRATEGY_BUDGET_JPY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Resolve mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode='${{ inputs.mode }}'
            force='${{ inputs.force }}'
          elif [ "${{ github.event_name }}" = "push" ]; then
            hour=$(TZ=Asia/Tokyo date +%H)
            if [ "$hour" -lt 12 ]; then mode='morning-retry'; else mode='evening'; fi
            force='false'
          else
            schedule='${{ github.event.schedule }}'
            case "$schedule" in
              '7 22 * * 0-4'|'27 22 * * 0-4'|'47 22 * * 0-4') mode='morning-retry' ;;
              *) mode='evening' ;;
            esac
            force='false'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"

      - name: Validate Discord webhook
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not configured"
            exit 1
          fi

      - name: Run Stock Watch V3
        shell: bash
        run: |
          mkdir -p logs outputs
          args=(--mode '${{ steps.mode.outputs.mode }}')
          if [ '${{ steps.mode.outputs.force }}' = 'true' ]; then
            args+=(--force)
          fi
          set -o pipefail
          python skills/investment-agent/stock_watch_runner.py "${args[@]}" 2>&1 | tee logs/stock-watch.log

      - name: Persist heartbeat and daily market data
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/stock-watch-diagnostic.json 2>/dev/null || true
          git add skills/investment-agent/data/daily_prices/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No Stock Watch runtime change to commit'
            exit 0
          fi
          git commit -m "Record Stock Watch runtime result"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin main
          git push
