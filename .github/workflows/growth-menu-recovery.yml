name: Morning Growth Lesson Recovery

on:
  schedule:
    - cron: '0 23 * * *' # 08:00 JST independent recovery check
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  recover-if-stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check today's published lesson
        id: check
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(TZ=Asia/Tokyo date +%F)
          export TARGET
          VALID=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          target = os.environ['TARGET']
          root = Path('outputs/growth-menu')
          required = [
              root / 'latest.json',
              root / 'latest.pdf',
              root / 'latest-preview.png',
              root / 'latest_notification.md',
              root / 'audit/latest.json',
          ]
          try:
              lesson = json.loads((root / 'latest.json').read_text(encoding='utf-8'))
              audit = json.loads((root / 'audit/latest.json').read_text(encoding='utf-8'))
              valid = (
                  all(path.exists() for path in required)
                  and lesson.get('date') == target
                  and audit.get('status') == 'pass'
                  and audit.get('checked_date') == target
              )
          except (OSError, json.JSONDecodeError):
              valid = False
          print('true' if valid else 'false')
          PY
          )
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "valid=$VALID" >> "$GITHUB_OUTPUT"

      - name: Dispatch offline recovery
        if: ${{ steps.check.outputs.valid != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_DATE: ${{ steps.check.outputs.target }}
        run: |
          gh workflow run growth-menu.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f target_date="$TARGET_DATE" \
            -f offline=true

      - name: Summary
        run: |
          echo "Target date: ${{ steps.check.outputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Already valid: ${{ steps.check.outputs.valid }}" >> "$GITHUB_STEP_SUMMARY"
