name: Stock Watch V3 Tests

on:
  push:
    branches: [main]
    paths:
      - 'skills/investment-agent/**'
      - 'tests/test_stock_watch_v2.py'
      - 'tests/test_stock_watch_v3.py'
      - 'tests/test_strategy_plan.py'
      - 'tests/test_purchase_authority.py'
      - 'tests/test_progress_notification.py'
      - 'tests/test_discord_report.py'
      - 'tests/test_jpx_trade_date.py'
      - 'tests/test_household_runtime.py'
      - 'tests/test_manual_logic.py'
      - 'tests/test_earnings_assessment.py'
      - 'tests/test_execution_reconciliation.py'
      - 'tests/test_privacy_boundary.py'
      - 'tests/test_replacement_assessment.py'
      - 'tests/test_stock_watch_runner_audit.py'
      - '.github/workflows/stock-watch*.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run Stock Watch tests
        run: python -m pytest -q tests/test_stock_watch_v2.py tests/test_stock_watch_v3.py tests/test_strategy_plan.py tests/test_purchase_authority.py tests/test_progress_notification.py tests/test_discord_report.py tests/test_jpx_trade_date.py tests/test_household_runtime.py tests/test_manual_logic.py tests/test_earnings_assessment.py tests/test_execution_reconciliation.py tests/test_replacement_assessment.py tests/test_stock_watch_runner_audit.py tests/test_privacy_boundary.py
